CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# This is the split CENTRAL: its input thread runs zip_button_behaviors, which
# invokes full key behaviors (&kp LG(EQUAL), etc.) when a trackpad gesture fires.
# That is a deep call chain (behavior -> HID -> event manager); the Zephyr default
# 512-byte input thread stack is tight for it, so give it room as cheap insurance
# against a stack overflow when a gesture is invoked.
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# Enter deep sleep https://zmk.dev/docs/features/low-power-states
CONFIG_ZMK_SLEEP=y

# Defaults to 15 minutes but 60 minutes is only very slightly more power draw and user experience is much better to not
# have keyboard go to deep sleep (i.e. having to reconenect to bluetooth)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# 'Regular' ZMK idle behavior (default 30000 = 30 s). On this half it mainly
# gates display/activity behavior; the trackpad power story lives on the RIGHT
# half (see toucan_right.conf and the `idle-sleep;` property in
# toucan_right.overlay) - each half tracks its activity independently.
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Change the style of the status screen. Available options: 0, 1, 2
CONFIG_TOUCAN_STATUS_SCREEN=2

CONFIG_INPUT_THREAD_STACK_SIZE=2048
