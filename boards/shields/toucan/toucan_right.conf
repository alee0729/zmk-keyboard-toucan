CONFIG_ZMK_POINTING=y

CONFIG_I2C=y
CONFIG_INPUT_TPS43=y
CONFIG_ZMK_MOUSE=y
CONFIG_I2C=y
CONFIG_INPUT_TPS43=y

CONFIG_ZMK_BATTERY_REPORTING=y

# Enter deep sleep https://zmk.dev/docs/features/low-power-states
CONFIG_ZMK_SLEEP=y

# Defaults to 15 minutes but 60 minutes is only very slightly more power draw and user experience is much better to not
# have keyboard go to deep sleep (i.e. having to reconenect to bluetooth)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# 'Regular' ZMK idle for THIS half (default 30000 = 30 s). Activity is tracked
# per half: right-half key presses and trackpad input keep this half ACTIVE;
# typing on the left half does not. On IDLE the trackpad is fully suspended -
# but only because toucan_right.overlay sets `idle-sleep;` on the tps43 node
# (the driver's suspend-on-idle is opt-in via that DT property). Measured:
# ~2.9 mA tracking vs ~1.7 mA never-suspended scanning floor; suspend takes the
# trackpad itself down to ~uA. Cost: a suspended trackpad can't wake itself -
# press any right-half key, then the first touch registers ~300 ms later.
CONFIG_ZMK_IDLE_TIMEOUT=30000

CONFIG_INPUT_THREAD_STACK_SIZE=2048
