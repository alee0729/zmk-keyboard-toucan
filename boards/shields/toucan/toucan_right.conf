CONFIG_ZMK_POINTING=y

CONFIG_I2C=y
CONFIG_INPUT_TPS43=y
CONFIG_ZMK_MOUSE=y
CONFIG_I2C=y
CONFIG_INPUT_TPS43=y

CONFIG_ZMK_BATTERY_REPORTING=y

# Enter deep sleep https://zmk.dev/docs/features/low-power-states
CONFIG_ZMK_SLEEP=y

# Defaults to 15 minutes but 60 minutes is only very slightly more power draw and user experience is much better to not
# have keyboard go to deep sleep (i.e. having to reconenect to bluetooth)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# 'Regular' ZMK idle for THIS half (ZMK default 30000 = 30 s). Activity is
# tracked per half: right-half key presses and trackpad input keep this half
# ACTIVE; typing on the left half does not. On IDLE the trackpad is fully
# suspended (`idle-sleep;` in toucan_right.overlay): SUSPEND bit set, RDY
# interrupt disabled, ~uA, cannot see touches.
#
# That suspend is what makes deep sleep reachable at all - it is not just a
# current-draw optimization. ZMK measures both this timeout and
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT from one shared last-activity timestamp, and
# upstream activity.c registers a wildcard input callback
# (INPUT_CALLBACK_DEFINE(NULL, ...) under CONFIG_ZMK_POINTING, no split-role
# guard), so ANY trackpad report resets both clocks. A pad left scanning for the
# whole hour only has to glitch once - a sub-threshold contact, a drifting ALP
# baseline - and this half never sleeps at all. Suspending it leaves 50 silent
# minutes for the deep-sleep timer to expire.
#
# Raised 30 s -> 10 min so the touch-to-wake window is usable: for 10 minutes
# after your last right-half key press or touch the pad is fully live. After
# that the first touch is ignored - press any right-half key and the pad is back
# in ~300 ms. Must stay well below CONFIG_ZMK_IDLE_SLEEP_TIMEOUT above.
CONFIG_ZMK_IDLE_TIMEOUT=600000

CONFIG_INPUT_THREAD_STACK_SIZE=2048
