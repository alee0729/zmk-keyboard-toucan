CONFIG_ZMK_POINTING=y

CONFIG_I2C=y
CONFIG_INPUT_TPS43=y
CONFIG_ZMK_MOUSE=y
CONFIG_I2C=y
CONFIG_INPUT_TPS43=y

CONFIG_ZMK_BATTERY_REPORTING=y

# Enter deep sleep https://zmk.dev/docs/features/low-power-states
CONFIG_ZMK_SLEEP=y

# Defaults to 15 minutes but 60 minutes is only very slightly more power draw and user experience is much better to not
# have keyboard go to deep sleep (i.e. having to reconenect to bluetooth)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# 'Regular' ZMK idle for THIS half (default 30000 = 30 s). Activity is tracked
# per half: right-half key presses and trackpad input keep this half ACTIVE;
# typing on the left half does not. On IDLE the trackpad drops to a 500 ms
# slow-scan floor (`idle-scan-rate-ms` in toucan_right.overlay): it keeps
# sensing and wakes itself on touch within ~0.5 s, no key press needed. Full
# suspend (~uA, cannot see touches) only happens at deep sleep. Measured:
# ~2.9 mA tracking, ~1.7 mA unmanaged scanning floor (160 ms LP2); the 500 ms
# idle floor sits well below that.
CONFIG_ZMK_IDLE_TIMEOUT=30000

CONFIG_INPUT_THREAD_STACK_SIZE=2048
